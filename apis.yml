aid: datosabiertos-rivasciudad-es
name: Portal oficial Ayuntamiento de Rivas Vaciamadrid
description: >-
  Portal oficial Ayuntamiento de Rivas Vaciamadrid is a open data portal open-data portal for Spain running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 7 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
