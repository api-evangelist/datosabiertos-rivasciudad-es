    name: Portal oficial Ayuntamiento de Rivas Vaciamadrid CKAN Action API
    description: >-
      CKAN Action API for Portal oficial Ayuntamiento de Rivas Vaciamadrid, a consistent JSON-over-HTTP interface over a catalog of 7 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://datosabiertos.rivasciudad.es/api/3/action/.
